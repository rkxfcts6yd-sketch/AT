<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fe; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border-top: 5px solid #6c5ce7; }
        h2 { color: #6c5ce7; margin-bottom: 20px; text-align: center; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #6c5ce7; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 15px; text-align: center; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Amazon Log</h2>
    <form id="amazonForm">
        <div class="field">
            <label>Date</label>
            <input type="date" id="date" name="Date" required>
        </div>
        <div class="field">
            <label>Category</label>
            <select name="Category" required>
                <option value="" disabled selected>Select Category</option>
                <option value="Grocery">🛒 Grocery</option>
                <option value="Bills">🧾 Bills</option>
                <option value="Fast Tag">🚗 Fast Tag</option>
                <option value="Personal">🎁 Personal</option>
                <option value="Other">💡 Other</option>
            </select>
        </div>
        <div class="field">
            <label>Amount (₹)</label>
            <input type="number" name="Amount" placeholder="0.00" step="0.01" required>
        </div>
        <div class="field">
            <label>Notes</label>
            <textarea name="Notes" rows="2" placeholder="Item details..."></textarea>
        </div>
        <button type="submit" id="submitBtn">Log Expense</button>
    </form>
    <div id="status"></div>
</div>

<script>
    // 1. PASTE YOUR NEW DEPLOYMENT URL HERE
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwgo4pN9XJMUOk096a-MfnIFwiU6Ho3BpSvBj-Z9VJFyYVClo0jvpOG-yPRSFxFcHMuhw/exec';

    const form = document.getElementById('amazonForm');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        status.innerHTML = "⌛ Sending...";

        // Use 'no-cors' to prevent the iPhone from blocking the request
        fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: new FormData(form) 
        })
        .then(() => {
            status.innerHTML = "✨ Data Saved to Sheet!";
            status.style.color = "green";
            form.reset();
            document.getElementById('date').valueAsDate = new Date();
            submitBtn.disabled = false;
        })
        .catch(error => {
            status.innerHTML = "❌ Connection Error";
            status.style.color = "red";
            submitBtn.disabled = false;
        });
    });

    document.getElementById('date').valueAsDate = new Date();
</script>
</body>
</html>
